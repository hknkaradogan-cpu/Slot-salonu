name: SLOT SALONU – test ve APK derleme

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sunucu testleri
        working-directory: server
        run: npm test
      - name: RTP simülasyonu (oyun başına 2 milyon spin)
        working-directory: server
        run: node --no-warnings tools/simulate.js --spins 2000000 --out sim.json
      - uses: actions/upload-artifact@v4
        with: { name: simulation-report, path: server/sim.json }

  android:
    runs-on: ubuntu-latest
    needs: server-tests
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK lisansları (runner'da SDK hazır kurulu)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PslotApiBase="${{ vars.SLOT_API_BASE || '' }}"
      - uses: actions/upload-artifact@v4
        with: { name: slot-salonu-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: APK'yı Releases'a yayınla (telefondan doğrudan indirme)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SlotSalonu.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SlotSalonu.apk --title "SLOT SALONU – derleme ${{ github.run_number }}" --notes "Otomatik derlenen APK (commit ${{ github.sha }})." --latest

      # İmzalı yayın sürümü: depo ayarlarında KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD gizlilerini tanımlayın
      - name: Release APK + AAB (Play Console için)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          export KEYSTORE_FILE="$PWD/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease -PslotApiBase="${{ vars.SLOT_API_BASE }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: slot-salonu-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
