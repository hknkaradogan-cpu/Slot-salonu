name: SLOT SALONU – test, sunucu yayını ve APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Supabase sunucusuna gizli anahtar olmadan (OIDC) kimlik kanıtlamak için

env:
  SLOT_API: https://sjcoopddwmfqoxhrjyqa.supabase.co/functions/v1/slot-api

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Bağımlılıklar
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Testler (API, oyun motoru, sunucu paketi)
        working-directory: server
        run: npm run build:edge && npm test
      - name: RTP simülasyonu (profil RTP'leri, oyun başına 2 milyon spin)
        working-directory: server
        run: node tools/simulate.js --spins 2000000 --rtp profil --out sim.json
      - name: Sunucuyu Supabase'e yayınla (yalnızca main)
        if: github.ref == 'refs/heads/main'
        working-directory: server
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=slot-salonu-release" | jq -r .value)
          curl -fsS -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: application/javascript" --data-binary @dist/server-bundle.js "$SLOT_API/ci/server-bundle"
          echo
      - name: Canlı sunucu duman testi
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          curl -fsS "$SLOT_API/api/health"; echo
          curl -fsS "$SLOT_API/api/setup/status"; echo
          curl -fsS "$SLOT_API/api/games" | jq -c '[.games[] | {id, rtp, volatility}]'
          U="ci$(date +%s)"; R=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"email\":\"$U@ci.test\",\"username\":\"$U\",\"password\":\"Ci$(date +%s)x\"}" "$SLOT_API/api/auth/register")
          T=$(echo "$R" | jq -r .token)
          curl -fsS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"game":"zeus","bet":100}' "$SLOT_API/api/spin" | jq -c '{win, balance, xp: .xp.xp, level: .xp.level}'
          curl -s -o /dev/null -w "oyuncu -> admin: %{http_code}\n" -H "Authorization: Bearer $T" "$SLOT_API/api/admin/users"
          curl -fsS -H "Authorization: Bearer $T" "$SLOT_API/api/okey/lobby" | jq -c '{stakes, online}'
          TID=$(curl -fsS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"mode":"tekli","stake":0,"rounds":1}' "$SLOT_API/api/okey/quick" | jq -r .tableId)
          curl -fsS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{}' "$SLOT_API/api/okey/$TID/start" > /dev/null
          curl -fsS -H "Authorization: Bearer $T" "$SLOT_API/api/okey/$TID" | jq -c '{status, round, rack: (.hand.rack|length), pile: .hand.pile}'
          curl -fsS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{}' "$SLOT_API/api/okey/$TID/leave" | jq -c .
      - uses: actions/upload-artifact@v4
        with: { name: simulation-report, path: server/sim.json }

  android:
    runs-on: ubuntu-latest
    needs: server
    if: "!contains(github.event.head_commit.message, '[yalnizca-sunucu]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Sabit imza anahtarını al (OIDC; depoda gizli bilgi tutulmaz)
        if: github.ref == 'refs/heads/main'
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=slot-salonu-release" | jq -r .value)
          curl -fsS -H "Authorization: Bearer $OIDC" "$SLOT_API/api/release/signing" > /tmp/s.json
          jq -r .keystore /tmp/s.json | base64 -d > "$RUNNER_TEMP/release.jks"
          for k in storePassword keyAlias keyPassword; do echo "::add-mask::$(jq -r .$k /tmp/s.json)"; done
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(jq -r .storePassword /tmp/s.json)" >> $GITHUB_ENV
          echo "KEY_ALIAS=$(jq -r .keyAlias /tmp/s.json)" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(jq -r .keyPassword /tmp/s.json)" >> $GITHUB_ENV
          rm /tmp/s.json
      - name: APK derle (imzalı)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PslotApiBase="$SLOT_API" -PversionCode=$((100 + ${{ github.run_number }})) -PversionName="5.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk ../Spinova101Okey.apk
      - name: Güncellemeyi yayınla (uygulama içi güncelleme + GitHub Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=slot-salonu-release" | jq -r .value)
          NOTES=$(git log -1 --pretty=%s | head -c 300 | jq -sRr @uri)
          curl -fsS -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: application/vnd.android.package-archive" --data-binary @Spinova101Okey.apk "$SLOT_API/api/release?code=$((100 + ${{ github.run_number }}))&name=5.0.${{ github.run_number }}&notes=$NOTES"
          echo
          gh release create "build-${{ github.run_number }}" Spinova101Okey.apk --title "SPINOVA 101 OKEY 5.0.${{ github.run_number }}" --notes "$(git log -1 --pretty=%B)" --latest
