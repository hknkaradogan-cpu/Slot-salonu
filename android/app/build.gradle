plugins { id 'com.android.application' }

// ---- Marka / müşteri ayarları (beyaz etiket) ----
// Her müşteri için: -PappId=com.musteri.slot -PappName="Müşteri Slot" -PslotApiBase=https://... ile derleyin.
def apiBase = (project.findProperty('slotApiBase') ?: '').toString()          // boşsa "yerel mod"
def appIdProp = (project.findProperty('appId') ?: 'com.slotsalonu.app').toString()
def appNameProp = (project.findProperty('appName') ?: 'SLOT SALONU').toString()
def vCode = (project.findProperty('versionCode') ?: '6').toString().toInteger()
def vName = (project.findProperty('versionName') ?: '3.0.0').toString()
def selfUpdate = (project.findProperty('selfUpdate') ?: 'true').toString().toBoolean() // Play Store sürümünde false

android {
    namespace 'com.slotsalonu.app'
    compileSdk 36

    defaultConfig {
        applicationId appIdProp
        minSdk 24
        targetSdk 36
        versionCode vCode
        versionName vName
        manifestPlaceholders = [appName: appNameProp]
        buildConfigField 'boolean', 'SELF_UPDATE', selfUpdate.toString()
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            // Tüm sürümler AYNI anahtarla imzalanır; böylece güncellemeler silmeden üstüne kurulur.
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/www').get().asFile
    }
}

// Web istemcisini (../../client) APK içine kopyala; sunucu adresi ve sürüm bilgisini yaz
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../client'))
    into(layout.buildDirectory.dir('generated/www/www'))
    exclude 'assets/README.txt'
    filesMatching('config.js') {
        filter { String line -> line.replace("apiBase: ''", "apiBase: '" + apiBase + "'").replace("appVersion: ''", "appVersion: '" + vName + "'") }
    }
    inputs.property('apiBase', apiBase)
    inputs.property('vName', vName)
}
tasks.named('preBuild') { dependsOn copyWeb }

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.16.0'
    // kotlin-stdlib 1.8+ jdk7/jdk8 sınıflarını içerir; eski ayrı paketlerle çakışmayı önler
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
