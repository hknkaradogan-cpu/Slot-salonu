plugins { id 'com.android.application' }

// Boş bırakılırsa APK "yerel mod"da çalışır (sunucusuz, veriler cihazda)
def apiBase = (project.findProperty('slotApiBase') ?: '').toString()

android {
    namespace 'com.slotsalonu.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.slotsalonu.app'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '2.3.0'
    }

    signingConfigs {
        release {
            // CI'da gizli değişkenlerden doldurulur; yoksa release derlemesi debug anahtarıyla imzalanır
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/www').get().asFile
    }
}

// Web istemcisini (../../client) APK içine kopyala ve sunucu adresini yaz
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../client'))
    into(layout.buildDirectory.dir('generated/www/www'))
    exclude 'assets/README.txt'
    filesMatching('config.js') {
        filter { String line -> line.replace("apiBase: ''", "apiBase: '" + apiBase + "'") }
    }
    inputs.property('apiBase', apiBase)
}
tasks.named('preBuild') { dependsOn copyWeb }

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
